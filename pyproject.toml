[project]
name = "skills-benchmark-uxui"
version = "0.1.0"
description = "Trustworthy evaluation benchmark for UX/UI skills of autonomous agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
mock = ["fastapi>=0.115", "uvicorn>=0.30", "requests>=2.28"]
web = ["trafilatura>=1.8", "requests>=2.28", "playwright>=1.40"]
sandbox = ["docker>=7.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
skills-benchmark-uxui = "skills_benchmark_uxui.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
